[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfy-api-generator"
version = "0.1.0"
description = "Generate a strongly-typed Python facade from a ComfyUI workflow_api.json file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["comfyui", "stable-diffusion", "code-generation", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "requests>=2.28",
    "aiohttp>=3.9",
]

[project.scripts]
comfy-gen = "comfy_api_generator.generate_api:_cli"

[project.urls]
Homepage = "https://github.com/anomalyco/comfy-api-generator"
Repository = "https://github.com/anomalyco/comfy-api-generator"
"Bug Tracker" = "https://github.com/anomalyco/comfy-api-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_api_generator"]
