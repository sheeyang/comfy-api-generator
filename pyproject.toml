[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfy-api-generator"
version = "0.1.0"
description = "Generate a strongly-typed Python facade from a ComfyUI workflow_api.json file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["comfyui", "stable-diffusion", "code-generation", "api"]

dependencies = [
    "requests>=2.28",
    "aiohttp>=3.9",
]

[project.scripts]
comfy-gen = "comfy_api_generator.generate_api:_cli"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_api_generator"]
